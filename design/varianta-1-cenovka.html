<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varianta 1: Cenovka (náhled první obrazovky)</title>
<!-- Jen pro náhled. Na produkci písmo hostujeme sami (bez požadavku na Google). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --muted: #4a4a4a;
    --tag: #ffd400;
    --red: #b3261e;
    --rule: 2px solid var(--ink);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Archivo", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: #e6e6e1;
    -webkit-text-size-adjust: 100%;
  }

  /* Plocha náhledu: dvě obrazovky 375 x 667 vedle sebe */
  .stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 32px 16px 64px; }
  .stage-head { width: 100%; max-width: 830px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .stage-head strong { color: var(--ink); }
  figure { width: 375px; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
  .screen {
    position: relative; width: 375px; height: 667px; overflow: hidden;
    background: var(--paper); outline: 1px solid #c9c9c4;
  }
  @media (max-width: 420px) {
    .stage { padding: 0 0 48px; gap: 24px; }
    .stage-head { padding: 16px 16px 0; }
    figure, .screen { width: 100%; }
    figcaption { padding: 0 16px; }
  }

  /* Hlavička */
  .bar { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 16px; border-bottom: var(--rule); }
  .logo { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
  .logo b { background: var(--ink); color: var(--paper); padding: 2px 5px; font-stretch: 75%; font-weight: 900; }
  .asof { font-size: 12px; color: var(--muted); }

  .body { padding: 16px 16px 0; }
  h1 {
    font-stretch: 72%; font-weight: 850; font-size: 35px; line-height: 1.0;
    letter-spacing: -0.01em; text-wrap: balance;
  }
  .sub { font-size: 15px; line-height: 1.35; margin-top: 8px; }

  /* Vstupy kalkulačky */
  .inputs { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; margin-top: 14px; }
  .field { border: var(--rule); padding: 5px 10px 4px; display: block; }
  .field span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input {
    width: 100%; border: 0; outline: 0; background: transparent; font: inherit;
    font-size: 22px; font-weight: 800; font-stretch: 80%; color: var(--ink); padding: 0;
  }
  .field:focus-within { box-shadow: 0 0 0 3px var(--tag); }

  /* Výsledek jako cenovky */
  .rows { margin-top: 14px; border-top: var(--rule); }
  .row { padding: 8px 0 9px; border-bottom: 1px solid var(--ink); }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .name { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .name small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  .amount { font-stretch: 75%; font-weight: 850; font-size: 24px; white-space: nowrap; line-height: 1; }
  .row.big .amount { background: var(--tag); padding: 3px 6px 2px; }
  .track { height: 8px; margin-top: 7px; position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); min-width: 3px; }
  .fill.range { background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px); }
  .row.big .fill { background: var(--red); }
  .note { font-size: 12px; line-height: 1.4; color: var(--muted); margin-top: 8px; }

  /* Srovnání B */
  .tabs { display: flex; margin-top: 14px; border: var(--rule); width: max-content; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; padding: 0 16px; height: 40px;
    background: var(--paper); color: var(--ink); border: 0; border-right: var(--rule); cursor: pointer;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .cmp { margin-top: 12px; border-top: var(--rule); }
  .cmp-head { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 0; border-bottom: var(--rule); }
  .cmp-head div { font-weight: 850; font-stretch: 75%; font-size: 20px; line-height: 1.05; }
  .cmp-head small { display: block; font-size: 12px; font-weight: 400; font-stretch: 100%; color: var(--muted); }
  .cmp-row { padding: 6px 0 7px; border-bottom: 1px solid var(--ink); }
  .cmp-label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .cmp-vals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 15px; font-weight: 700; line-height: 1.25; }
  .cmp-vals .num { font-stretch: 80%; font-weight: 850; font-size: 19px; }
  .cmp-vals small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }

  /* Pevná lišta s výzvou */
  .cta {
    position: absolute; left: 0; right: 0; bottom: 0; height: 68px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 12px 0 16px; background: var(--ink); color: var(--paper);
  }
  .cta p { font-size: 14px; font-weight: 700; line-height: 1.25; }
  .cta p small { display: block; font-weight: 400; font-size: 12px; color: #d4d4d4; }
  .cta a {
    flex: none; display: inline-flex; align-items: center; height: 48px; padding: 0 18px;
    background: var(--tag); color: var(--ink); font-weight: 850; font-size: 16px; text-decoration: none;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-head">
    <strong>Varianta 1: Cenovka.</strong> Výrazná černá na bílé, jedna žlutá barva jako cenovka v obchodě, čísla přes celou šířku. Obě obrazovky mají přesně 375 × 667 px a ukazují jen to, co je vidět bez scrollování. Kalkulačka v náhledu počítá naostro (zkuste změnit částku).
  </div>

  <!-- Reklama A -->
  <figure>
    <div class="screen" data-calc>
      <header class="bar">
        <div class="logo"><b>ETF</b>v korunách</div>
        <div class="asof">data k 12. 10. 2026</div>
      </header>
      <div class="body">
        <h1>Kolik vás za 20&nbsp;let stojí samotný fond?</h1>
        <div class="inputs">
          <label class="field"><span>Měsíčně ukládám</span><input inputmode="numeric" value="2 000 Kč" data-monthly></label>
          <label class="field"><span>Po dobu</span><input inputmode="numeric" value="20&nbsp;let" data-years></label>
        </div>
        <div class="rows">
          <div class="row">
            <div class="row-top">
              <div class="name">VOO, ETF z NYSE Arca<small>TER 0,03&nbsp;% ročně</small></div>
              <div class="amount" data-out="voo">1 443 Kč</div>
            </div>
            <div class="track"><div class="fill" data-bar="voo"></div></div>
          </div>
          <div class="row">
            <div class="row-top">
              <div class="name">Evropské fondy na S&amp;P&nbsp;500<small>CSPX, SPYL, VUAA: TER 0,03 až 0,07&nbsp;%</small></div>
              <div class="amount" data-out="eu">1 443 až 3 359 Kč</div>
            </div>
            <div class="track"><div class="fill range" data-bar="eu"></div></div>
          </div>
          <div class="row big">
            <div class="row-top">
              <div class="name">Průměrný akciový fond v EU<small>průběžné náklady 1,38&nbsp;% (ESMA)</small></div>
              <div class="amount" data-out="avg">61 171 Kč</div>
            </div>
            <div class="track"><div class="fill" data-bar="avg"></div></div>
          </div>
        </div>
        <p class="note">I kdyby se peníze vůbec nezhodnotily. Jen náklady fondu, bez poplatků brokera, směny měn a daní. Zdroj: emitenti fondů, ESMA 3. 3. 2026.</p>
      </div>
      <div class="cta">
        <p>Srovnání 11 fondů v PDF<small>zdarma, stáhnete hned</small></p>
        <a href="#">Chci PDF</a>
      </div>
    </div>
    <figcaption><strong>Reklama A</strong> (utm_content=a_naklady): navazuje na titulek „1 400 Kč, nebo 61 000 Kč?“. Výsledek kalkulačky je vidět hned.</figcaption>
  </figure>

  <!-- Reklama B -->
  <figure>
    <div class="screen" data-cmp>
      <header class="bar">
        <div class="logo"><b>ETF</b>v korunách</div>
        <div class="asof">data k 12. 10. 2026</div>
      </header>
      <div class="body">
        <h1>VOO vedle evropského fondu na stejný index</h1>
        <p class="sub">Náklady, velikost a kde je v Česku koupíte. Data od emitentů.</p>
        <div class="tabs" role="group" aria-label="Americký fond">
          <button aria-pressed="true" data-fund="VOO">VOO</button>
          <button aria-pressed="false" data-fund="SPY">SPY</button>
          <button aria-pressed="false" data-fund="IVV">IVV</button>
        </div>
        <div class="cmp">
          <div class="cmp-head">
            <div data-f="ticker">VOO<small>USA, burza NYSE Arca</small></div>
            <div>Evropské fondy<small>CSPX, SPYL, VUAA, Irsko</small></div>
          </div>
          <div class="cmp-row">
            <div class="cmp-label">Index</div>
            <div class="cmp-vals"><div>S&amp;P&nbsp;500</div><div>S&amp;P&nbsp;500</div></div>
          </div>
          <div class="cmp-row">
            <div class="cmp-label">Roční náklady (TER)</div>
            <div class="cmp-vals"><div class="num" data-f="ter">0,03&nbsp;%</div><div class="num">0,03 až 0,07&nbsp;%</div></div>
          </div>
          <div class="cmp-row">
            <div class="cmp-label">Velikost (čistá aktiva)</div>
            <div class="cmp-vals"><div data-f="size">1 000 mld. USD<small>jen třída ETF</small></div><div>20 až 158 mld. USD<small>jen třídy Acc</small></div></div>
          </div>
          <div class="cmp-row">
            <div class="cmp-label">Koupím ho z Česka?</div>
            <div class="cmp-vals"><div>Fio ano, DEGIRO ne, XTB jen CFD</div><div>registrované v ČR (podle emitentů)</div></div>
          </div>
        </div>
        <p class="note">Srovnání slouží pro informaci, nejde o doporučení.</p>
      </div>
      <div class="cta">
        <p>Všech 11 fondů v PDF<small>zdarma, stáhnete hned</small></p>
        <a href="#">Chci PDF</a>
      </div>
    </div>
    <figcaption><strong>Reklama B</strong> (utm_content=b_srovnani): navazuje na titulek „VOO vedle evropského fondu na stejný index“. Přepínač VOO / SPY / IVV funguje.</figcaption>
  </figure>
</div>

<script>
  // Stejný model jako v docs/zdroje-dat.md: vklad na začátku měsíce, TER strhávaný měsíčně, výnos 0&nbsp;%.
  function cost(monthly, years, ter) {
    let v = 0;
    const f = Math.pow(1 - ter / 100, 1 / 12);
    for (let i = 0; i < years * 12; i++) v = (v + monthly) * f;
    return monthly * years * 12 - v;
  }
  const kc = n => Math.round(n).toLocaleString("cs-CZ") + "\u00a0Kč";
  const digits = s => parseInt(String(s).replace(/\D/g, ""), 10) || 0;

  document.querySelectorAll("[data-calc]").forEach(root => {
    const m = root.querySelector("[data-monthly]");
    const y = root.querySelector("[data-years]");
    function render() {
      const monthly = Math.min(digits(m.value), 1000000);
      const years = Math.min(Math.max(digits(y.value), 1), 50);
      const voo = cost(monthly, years, 0.03);
      const euMax = cost(monthly, years, 0.07);
      const avg = cost(monthly, years, 1.38);
      root.querySelector('[data-out="voo"]').textContent = kc(voo);
      root.querySelector('[data-out="eu"]').textContent = Math.round(voo).toLocaleString("cs-CZ") + " až " + kc(euMax);
      root.querySelector('[data-out="avg"]').textContent = kc(avg);
      const pct = n => (avg ? (n / avg) * 100 : 0) + "%";
      root.querySelector('[data-bar="voo"]').style.width = pct(voo);
      root.querySelector('[data-bar="eu"]').style.width = pct(euMax);
      root.querySelector('[data-bar="avg"]').style.width = pct(avg);
      root.querySelector("h1").textContent = "Kolik vás za " + years + " let stojí samotný fond?";
    }
    m.addEventListener("focus", () => (m.value = digits(m.value) || ""));
    y.addEventListener("focus", () => (y.value = digits(y.value) || ""));
    m.addEventListener("blur", () => (m.value = digits(m.value).toLocaleString("cs-CZ") + " Kč"));
    y.addEventListener("blur", () => (y.value = digits(y.value) + "\u00a0let"));
    m.addEventListener("input", render);
    y.addEventListener("input", render);
    render();
  });

  // Data z data/etf.csv (aktiva celého fondu, u VOO jen třída ETF)
  const US = {
    VOO: { ter: "0,03\u00a0%", size: "1 000 mld. USD<small>jen třída ETF</small>" },
    SPY: { ter: "0,0945\u00a0%", size: "822 mld. USD" },
    IVV: { ter: "0,03\u00a0%", size: "896 mld. USD" }
  };
  document.querySelectorAll("[data-cmp]").forEach(root => {
    root.querySelectorAll("[data-fund]").forEach(btn => btn.addEventListener("click", () => {
      const k = btn.dataset.fund;
      root.querySelectorAll("[data-fund]").forEach(b => b.setAttribute("aria-pressed", b === btn));
      root.querySelector('[data-f="ticker"]').firstChild.textContent = k;
      root.querySelector('[data-f="ter"]').textContent = US[k].ter;
      root.querySelector('[data-f="size"]').innerHTML = US[k].size;
    }));
  });
</script>
</body>
</html>
