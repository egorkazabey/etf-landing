<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varianta 2: Datový článek (náhled první obrazovky)</title>
<!-- Jen pro náhled. Na produkci písma hostujeme sami (bez požadavku na Google). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500..700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1b19;
    --paper: #f5f0e6;
    --muted: #57534b;
    --petrol: #0e5a5e;
    --rust: #a63d1e;
    --hair: #cfc6b4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--ink);
    background: #dcd6ca;
    -webkit-text-size-adjust: 100%;
  }
  .num, .val, .field input { font-variant-numeric: tabular-nums; }

  /* Plocha náhledu: dvě obrazovky 375 x 667 vedle sebe */
  .stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 32px 16px 64px; }
  .stage-head { width: 100%; max-width: 830px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .stage-head strong { color: var(--ink); }
  figure { width: 375px; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
  .screen {
    position: relative; width: 375px; height: 667px; overflow: hidden;
    background: var(--paper); outline: 1px solid #b9b2a3;
  }
  @media (max-width: 420px) {
    .stage { padding: 0 0 48px; gap: 24px; }
    .stage-head { padding: 16px 16px 0; }
    figure, .screen { width: 100%; }
    figcaption { padding: 0 16px; }
  }

  /* Hlavička */
  .bar { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 18px 9px; border-bottom: 1px solid var(--ink); }
  .logo { font-family: "Newsreader", Georgia, serif; font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
  .logo i { font-style: italic; font-weight: 500; }
  .asof { font-size: 12px; color: var(--muted); }

  .body { padding: 14px 18px 0; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--petrol); }
  h1 {
    font-family: "Newsreader", Georgia, serif; font-optical-sizing: auto;
    font-weight: 600; font-size: 31px; line-height: 1.08; letter-spacing: -0.015em;
    margin-top: 6px; text-wrap: balance;
  }

  /* Kalkulačka jako věta */
  .sentence { font-size: 17px; line-height: 1.6; margin-top: 12px; }
  .field { display: inline-block; }
  .field input {
    font: inherit; font-weight: 700; color: var(--petrol); background: transparent;
    border: 0; border-bottom: 2px solid var(--petrol); border-radius: 0; outline: 0;
    padding: 0 2px; text-align: center; min-height: 32px;
  }
  .field input:focus { background: #e6efe9; }
  .w-monthly { width: 76px; }
  .w-years { width: 36px; }

  /* Graf */
  .chart { margin-top: 8px; }
  .item { padding: 7px 0 8px; border-top: 1px solid var(--hair); }
  .item:first-child { border-top: 0; }
  .label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; line-height: 1.25; }
  .label .val { font-weight: 700; font-size: 17px; white-space: nowrap; }
  .label small { color: var(--muted); font-size: 12px; }
  sup { font-size: 0.7em; color: var(--petrol); font-weight: 600; }
  .track { height: 12px; margin-top: 5px; position: relative; border-left: 1px solid var(--ink); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--petrol); min-width: 2px; }
  .fill.range { background: repeating-linear-gradient(135deg, var(--petrol) 0 2px, transparent 2px 5px); }
  .item.big .fill { background: var(--rust); }
  .item.big .val { color: var(--rust); }
  .notes { font-size: 12px; line-height: 1.45; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--ink); }

  /* Tabulka B */
  .stand { font-size: 16px; line-height: 1.45; margin-top: 8px; }
  .tabs { display: flex; gap: 18px; margin-top: 12px; border-bottom: 1px solid var(--hair); }
  .tabs button {
    font: inherit; font-weight: 600; font-size: 15px; height: 40px; padding: 0 2px;
    background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent;
    margin-bottom: -1px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--petrol); }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 14px; line-height: 1.3; }
  th, td { text-align: left; vertical-align: top; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--hair); }
  thead th { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--ink); }
  tbody th { font-weight: 400; color: var(--muted); font-size: 13px; width: 24%; }
  td { font-weight: 600; width: 38%; }
  td.num { font-size: 16px; }

  /* Pevná lišta s výzvou */
  .cta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 18px 12px; background: var(--paper); border-top: 1px solid var(--ink);
  }
  .cta a {
    display: flex; align-items: center; justify-content: center; height: 50px;
    background: var(--petrol); color: #fff; border-radius: 4px;
    font-weight: 600; font-size: 16px; text-decoration: none;
  }
  .cta p { font-size: 12px; color: var(--muted); text-align: center; margin-top: 5px; }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-head">
    <strong>Varianta 2: Datový článek.</strong> Vypadá jako graf z datové rubriky novin: patkový titulek, teplý papír, tenké linky, zdroje jako poznámky pod čarou. Obě obrazovky mají přesně 375 × 667 px a ukazují jen to, co je vidět bez scrollování. Kalkulačka v náhledu počítá naostro (zkuste změnit částku ve větě).
  </div>

  <!-- Reklama A -->
  <figure>
    <div class="screen" data-calc>
      <header class="bar">
        <div class="logo">ETF <i>v korunách</i></div>
        <div class="asof">data k 12. 10. 2026</div>
      </header>
      <div class="body">
        <div class="kicker">Náklady fondů v korunách</div>
        <h1>Kolik vás za 20&nbsp;let stojí samotný fond?</h1>
        <p class="sentence">
          Když ukládám
          <label class="field"><input class="w-monthly" inputmode="numeric" value="2 000" aria-label="Měsíční částka v Kč" data-monthly></label>
          Kč měsíčně po dobu
          <label class="field"><input class="w-years" inputmode="numeric" value="20" aria-label="Počet let" data-years></label>
          let, na nákladech fondu zaplatím:
        </p>
        <div class="chart">
          <div class="item">
            <div class="label"><span>VOO, ETF z NYSE Arca<sup>1</sup> <small>0,03&nbsp;%</small></span><span class="val" data-out="voo">1 443 Kč</span></div>
            <div class="track"><div class="fill" data-bar="voo"></div></div>
          </div>
          <div class="item">
            <div class="label"><span>Evropské fondy na S&amp;P&nbsp;500<sup>1</sup> <small>0,03 až 0,07&nbsp;%</small></span><span class="val" data-out="eu">1 443 až 3 359 Kč</span></div>
            <div class="track"><div class="fill range" data-bar="eu"></div></div>
          </div>
          <div class="item big">
            <div class="label"><span>Průměrný akciový fond v EU<sup>2</sup> <small>1,38&nbsp;%</small></span><span class="val" data-out="avg">61 171 Kč</span></div>
            <div class="track"><div class="fill" data-bar="avg"></div></div>
          </div>
        </div>
        <p class="notes">Bez zhodnocení, jen náklady fondu (bez brokera, směny a daní). <sup>1</sup> Emitenti fondů, 12. 10. 2026. <sup>2</sup> ESMA, zpráva z 3. 3. 2026.</p>
      </div>
      <div class="cta">
        <a href="#">Stáhnout srovnání 11 fondů v PDF</a>
        <p>Zdarma, stáhnete hned po zadání e-mailu.</p>
      </div>
    </div>
    <figcaption><strong>Reklama A</strong> (utm_content=a_naklady): navazuje na titulek „1 400 Kč, nebo 61 000 Kč?“. Vstupy jsou součástí věty.</figcaption>
  </figure>

  <!-- Reklama B -->
  <figure>
    <div class="screen" data-cmp>
      <header class="bar">
        <div class="logo">ETF <i>v korunách</i></div>
        <div class="asof">data k 12. 10. 2026</div>
      </header>
      <div class="body">
        <div class="kicker">Stejný index, dvě cesty</div>
        <h1>VOO, SPY a evropské fondy na stejný index vedle sebe</h1>
        <p class="stand">Náklady, velikost a kde je v Česku koupíte. Podle dat emitentů.</p>
        <div class="tabs" role="group" aria-label="Americký fond">
          <button aria-pressed="true" data-fund="VOO">VOO</button>
          <button aria-pressed="false" data-fund="SPY">SPY</button>
          <button aria-pressed="false" data-fund="IVV">IVV</button>
        </div>
        <table>
          <thead>
            <tr><th></th><th data-f="ticker">VOO (USA)</th><th>Evropské<sup>1</sup></th></tr>
          </thead>
          <tbody>
            <tr><th>Index</th><td>S&amp;P&nbsp;500</td><td>S&amp;P&nbsp;500</td></tr>
            <tr><th>Roční náklady</th><td class="num" data-f="ter">0,03&nbsp;%</td><td class="num">0,03 až 0,07&nbsp;%</td></tr>
            <tr><th>Velikost</th><td data-f="size">1 000 mld. USD<sup>2</sup></td><td>20 až 158 mld. USD<sup>2</sup></td></tr>
            <tr><th>Koupím z ČR?</th><td>Fio ano, DEGIRO ne, XTB jen CFD</td><td>registrované v ČR (podle emitentů)</td></tr>
          </tbody>
        </table>
      </div>
      <div class="cta">
        <a href="#">Stáhnout srovnání 11 fondů v PDF</a>
        <p>Zdarma, stáhnete hned po zadání e-mailu.</p>
      </div>
    </div>
    <figcaption><strong>Reklama B</strong> (utm_content=b_srovnani): navazuje na titulek „VOO vedle evropského fondu na stejný index“. Poznámky (<sup>1</sup> CSPX, SPYL, VUAA, Irsko; <sup>2</sup> jen třída ETF/Acc) jsou pod tabulkou, pod ohybem.</figcaption>
  </figure>
</div>

<script>
  // Stejný model jako v docs/zdroje-dat.md: vklad na začátku měsíce, TER strhávaný měsíčně, výnos 0&nbsp;%.
  function cost(monthly, years, ter) {
    let v = 0;
    const f = Math.pow(1 - ter / 100, 1 / 12);
    for (let i = 0; i < years * 12; i++) v = (v + monthly) * f;
    return monthly * years * 12 - v;
  }
  const kc = n => Math.round(n).toLocaleString("cs-CZ") + "\u00a0Kč";
  const digits = s => parseInt(String(s).replace(/\D/g, ""), 10) || 0;

  document.querySelectorAll("[data-calc]").forEach(root => {
    const m = root.querySelector("[data-monthly]");
    const y = root.querySelector("[data-years]");
    function render() {
      const monthly = Math.min(digits(m.value), 1000000);
      const years = Math.min(Math.max(digits(y.value), 1), 50);
      const voo = cost(monthly, years, 0.03);
      const euMax = cost(monthly, years, 0.07);
      const avg = cost(monthly, years, 1.38);
      root.querySelector('[data-out="voo"]').textContent = kc(voo);
      root.querySelector('[data-out="eu"]').textContent = Math.round(voo).toLocaleString("cs-CZ") + " až " + kc(euMax);
      root.querySelector('[data-out="avg"]').textContent = kc(avg);
      const pct = n => (avg ? (n / avg) * 100 : 0) + "%";
      root.querySelector('[data-bar="voo"]').style.width = pct(voo);
      root.querySelector('[data-bar="eu"]').style.width = pct(euMax);
      root.querySelector('[data-bar="avg"]').style.width = pct(avg);
      root.querySelector("h1").textContent = "Kolik vás za " + years + " let stojí samotný fond?";
    }
    m.addEventListener("blur", () => (m.value = digits(m.value).toLocaleString("cs-CZ")));
    m.addEventListener("input", render);
    y.addEventListener("input", render);
    render();
  });

  // Data z data/etf.csv (aktiva celého fondu, u VOO jen třída ETF)
  const US = {
    VOO: { ter: "0,03\u00a0%", size: "1 000 mld. USD<sup>2</sup>" },
    SPY: { ter: "0,0945\u00a0%", size: "822 mld. USD" },
    IVV: { ter: "0,03\u00a0%", size: "896 mld. USD" }
  };
  document.querySelectorAll("[data-cmp]").forEach(root => {
    root.querySelectorAll("[data-fund]").forEach(btn => btn.addEventListener("click", () => {
      const k = btn.dataset.fund;
      root.querySelectorAll("[data-fund]").forEach(b => b.setAttribute("aria-pressed", b === btn));
      root.querySelector('[data-f="ticker"]').textContent = k + " (USA)";
      root.querySelector('[data-f="ter"]').textContent = US[k].ter;
      root.querySelector('[data-f="size"]').innerHTML = US[k].size;
    }));
  });
</script>
</body>
</html>
