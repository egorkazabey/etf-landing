# Kontrola dat, textů, PDF a reklam (scripts/check.mjs) při každém push a pull requestu.
# Kontrola jen čte soubory: nepotřebuje Chrome, databázi ani tajné údaje.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
